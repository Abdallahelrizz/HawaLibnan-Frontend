<!-- Main HTML for explore.html -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hawa Libnan · Explore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
<header class="navbar" id="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 2l3 6 6 .9-4.5 4.4 1.1 6.3L12 16.8 6.4 19.6l1.1-6.3L3 8.9 9 8z" fill="currentColor"/></svg>
      <span class="brand-text">Hawa Libnan</span>
    </a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="explore.html" class="active">Explore</a>
      <a href="categories.html">Categories</a>
      <a href="community.html">Community</a>
      <a href="profile.html">Profile</a>
      <span class="spacer"></span>
      <a id="loginLink" class="nav-cta" href="login.html">Login</a>
      <a id="signupLink" class="signup-btn" href="signup.html">Sign up</a>
      <button id="logoutBtn" class="btn ghost small hide">Logout</button>
      <button id="themeToggle" class="btn ghost small" aria-label="Toggle theme">☀️</button>
    </nav>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <h2 class="page-title">Explore Lebanon</h2>
    <button id="addPlaceBtn" class="btn small addplace">+ Add Place</button>
  </div>

  <!-- New Search and Filter Row -->
  <div class="search-row">
    <input id="searchInput" type="text" placeholder="Search places..." />
    <span id="activeCategory" class="muted small" style="margin-left:auto;"></span>
  </div>

  <section id="cards" class="masonry"></section>
</main>

<!-- Took from ChatGPT -->
<div id="modal" class="modal hidden" aria-hidden="true" role="dialog">
  <div class="modal-content postview">
    <button class="modal-close" id="closeModal" aria-label="Close">×</button>
    <img id="modalImg" alt="" />
    <div class="modal-text">
      <h3 id="modalTitle"></h3>
      <p id="modalDesc"></p>
      <p class="muted" id="modalCategory"></p>
      <p class="muted"><a id="modalLocationLink" class="location-link" href="#" target="_blank" rel="noopener">View location</a></p>
      <div id="modalReviews" class="reviews"></div>
    </div>
  </div>
  <div class="backdrop" id="backdrop"></div>
</div>
<!-- Add Place Modal (matches main.js expectations) -->
<div id="addModal" class="modal hidden" aria-hidden="true" role="dialog">
  <div class="modal-content narrow">
    <button class="modal-close" id="closeAdd" aria-label="Close">×</button>
    <div class="modal-text">
      <h3>Add a New Place</h3>
      <form id="addForm" class="form">
        <label>Name <input id="addName" required></label>
        <label>Category
          <select id="addCategory" required>
            <option value="">Select…</option>
            <option>Beach</option>
            <option>Cave</option>
            <option>Mountain</option>
            <option>Valley</option>
            <option>Souk</option>
            <option>City</option>
            <option>Historic</option>
            <option>Nightlife</option>
            <option>Restaurant</option>
            <option>District</option>
            <option>Park</option>
          </select>
        </label>
        <label>Description <textarea id="addDesc" rows="3"></textarea></label>

        <label>Location Link
          <input id="addLocation" type="url" placeholder="https://maps.google.com/…" required>
        </label>
        <small class="muted">Please paste a sharable map/location link.</small>

        <!-- Either upload a file or paste an image URL -->
        <label>Upload Image <input type="file" id="addFile" accept="image/*"></label>
        <label>Or Image URL <input id="addImage" placeholder="https://…(jpg, jpeg, png, webp)"></label>

        <button class="btn primary" type="submit">Add Place</button>
      </form>
    </div>
  </div>
  <div class="backdrop" id="backdropAdd"></div>
</div>


<footer class="footer"><p>© 2025 Hawa Libnan · Explore responsibly</p></footer>
</body>
</html>
