<!-- Main HTML for community.html -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hawa Libnan · Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="community.js" defer></script>
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2l3 6 6 .9-4.5 4.4 1.1 6.3L12 16.8 6.4 19.6l1.1-6.3L3 8.9 9 8z" fill="currentColor"/>
        </svg>
        <span class="brand-text">Hawa Libnan</span>
      </a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="categories.html">Categories</a>
        <a href="community.html" class="active">Community</a>
        <a href="profile.html">Profile</a>
        <span class="spacer"></span>
        <a id="loginLink" class="nav-cta" href="login.html">Login</a>
        <a id="signupLink" class="signup-btn" href="signup.html">Sign up</a>
        <button id="logoutBtn" class="btn ghost small hide">Logout</button>
        <button id="themeToggle" class="btn ghost small" aria-label="Toggle theme">☀️</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <h2 class="page-title">Community</h2>
      <button id="addPostBtn" class="btn small addplace">+ Create Post</button>
    </div>

    <section id="feed" class="feed scroll-feed"></section>
  </main>

  <!-- Took from ChatGPT -->
  <div id="addPostModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content narrow">
      <button class="modal-close" id="closeAddPost" aria-label="Close">×</button>
      <div class="modal-text">
        <h3>Create a New Post</h3>
        <form id="addPostForm" class="form">
          <label>Upload Image <input type="file" id="postImage" accept="image/*" ></label>
          <label>Caption<textarea id="postCaption" rows="3" placeholder="Write something..."></textarea></label>
          <!-- Image URL field added to allow persistent images without implementing full file uploads -->
          <label>Image URL (optional)</label>
          <input type="text" id="postImageUrl" placeholder="https://example.com/image.jpg">
          <button class="btn primary" type="submit">Post</button>
        </form>
      </div>
    </div>
    <div class="backdrop" id="backdropAddPost"></div>
  </div>

  <!-- Took from ChatGPT -->
  <div id="threadModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content postview">
      <button class="modal-close" id="closeThread" aria-label="Close">×</button>
      <img id="threadImg" alt="">
      <div class="modal-text">
        <h3 id="threadUser"></h3>
        <p id="threadText"></p>
        <p id="likeCount" class="muted small"></p>
        <button id="likeBtn" class="btn small">♡ Like</button>
        <div id="comments" class="reviews"></div>
        <form id="replyForm" class="form small">
          <input id="replyInput" placeholder="Write a comment" required>
          <button class="btn small primary" type="submit">Send</button>
        </form>
      </div>
    </div>
    <div class="backdrop" id="backdropThread"></div>
  </div>

  <footer class="footer">
    <p>© 2025 Hawa Libnan · Explore responsibly</p>
  </footer>
</body>
</html>
